version: '3.9'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lucrom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lucrom}
      POSTGRES_DB: ${DB_NAME:-lucrom_studio_ai}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-lucrom}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "npm run migration:run && node dist/main.js"
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: node dist/worker-main.js
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:3000
        NEXT_PUBLIC_TENANT_ID: ${DEFAULT_TENANT_ID:-}
        NEXT_PUBLIC_SHOW_INTERNAL_VIEWS: ${SHOW_INTERNAL_VIEWS:-false}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:3000
      JWT_SECRET: jwt-secret-dev-2026
      API_TOKEN: lucrom-dev-secret-2026
      REDIS_URL: redis://redis:6379
    env_file:
      - ./apps/api/.env
    ports:
      - '3001:3001'
    depends_on:
      - api
  
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lucrom
      MINIO_ROOT_PASSWORD: lucrom123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: